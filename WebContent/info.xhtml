<title>SeqAPASS Login Index</title>

<h:body>
	<ui:composition template="/WEB-INF/templates/drupal.xhtml">
		<ui:define name="title">

	<ui:define name="header">

			<h:panelGrid columns="2" cellpadding="10" styleClass="seq_mainHeader"

				</p:column>
			</h:panelGrid>
		</h:form>
		</ui:define>


		<ui:define name="content">
			<ui:include src="about.xhtml"/>
		</ui:define>
	</ui:composition>
