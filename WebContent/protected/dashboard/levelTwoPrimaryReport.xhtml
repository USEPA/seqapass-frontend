<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<!-- Do not use <head> here, as it would break down tabs -->

<body>
	<ui:composition>
		<p:dataTable id="reportLevelTwoPrimaryTableId" var="r"
			widgetVar="LevTwoPrimaryTable"
			value="#{reportView.levelTwoPrimaryReport}"
			emptyMessage="No entries found with given criteria"
			filteredValue="#{reportView.filteredLevelTwoPrimaryReport}"
			resizableColumns="true" draggableColumns="false"
			rowStyleClass="#{reportView.highlightZeroOrtho==true ? (reportView.level2_ortholog_count==0 ? 'zeroOrtho' : null) : null}"
			scrollable="true" scrollWidth="95%" paginator="true"
			paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {Exporters}"
			paginatorPosition="bottom" rows="10" rowsPerPageTemplate="10,20,50">
			<f:facet name="header">
				<p:outputPanel>
					<h:outputText value="Search:" />
					<p:inputText id="globalFilter"
						onkeyup="PF('LevTwoPrimaryTable').filter()" style="width:150px"
						placeholder="Enter keyword" />
					<p:commandLink styleClass="infoBtn" 
						oncomplete="PF('infoDlg').show();" action="#{reportView.populateInfoText('levTwoPrimaryReport')}" update="tabView:reportForm:levelTwoInfoBox">
						<p:graphicImage library="images" name="info_small.png" style="padding:5px; border-radius:50%; width:15px"/>
					</p:commandLink>
				</p:outputPanel>
			</f:facet>
			<f:facet name="{Exporters}">
				<h:panelGroup>
					<h:outputText value="Download Table:" />
					<h:commandLink>
						<p:graphicImage id="excelIcon" library="images" name="excel.png" />
						<p:dataExporter type="xls" target="reportLevelTwoPrimaryTableId"
							fileName="SeqAPASS_Level2_Primary_Report" />
						<p:tooltip id="excelIconTip" for="excelIcon"
							value="Download table in excel(.xls) format" />
					</h:commandLink>

					<h:commandLink>
						<p:graphicImage id="csvIcon" library="images" name="csv.png" />
						<p:dataExporter type="csv" target="reportLevelTwoPrimaryTableId"
							fileName="SeqAPASS_Level2_Primary_Report" />
						<p:tooltip id="csvIconTip" for="csvIcon"
							value="Download table in csv format" />
					</h:commandLink>
				</h:panelGroup>
			</f:facet>
			<p:column headerText="Data Version"
				style="width:80px;text-align:center;font-size:0.75em;white-space:normal">
				<h:outputText value="#{r.updateVersion}" />
			</p:column>
			<p:column headerText="NCBI Accession" sortBy="#{r.accession}"
				filterBy="#{r.accession}"
				style="width:150px;text-align:center;;font-size:0.75em"
				filterStyle="display:none"
				exportFunction="#{reportView.exportLink}">
				<p:link href="http://www.ncbi.nlm.nih.gov/protein/#{r.accession}"
					value="#{r.accession}" target="_blank" rel="noreferrer noopener"/>
			</p:column>
			<p:column headerText="Protein Count" sortBy="#{r.proteinCount}"
				style="width:80px;text-align:center;;font-size:0.75em;white-space:normal">
				<h:outputText value="#{r.proteinCount}" />
			</p:column>
			<p:column headerText="Species Tax ID" sortBy="#{r.speciesTaxId}"
				style="width:80px;text-align:center;;font-size:0.75em;white-space:normal"
				exportFunction="#{reportView.exportLink}">
				<p:link
					href="http://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&amp;id=#{r.speciesTaxId}&amp;lvl=3&amp;lin=f&amp;keep=1&amp;srchmode=1&amp;unlock"
					value="#{r.speciesTaxId}" target="_blank" rel="noreferrer noopener"/>
			</p:column>
			<p:column headerText="Taxonomic Group" sortBy="#{r.defaultTaxonomyName}"
				filterBy="#{r.defaultTaxonomyName}"
				style="width:120px;text-align:center;;font-size:0.75em;white-space:normal"
				filterStyle="display:none">
				<h:outputText value="#{r.defaultTaxonomyName}" />
			</p:column>
			<p:column headerText="Filtered Taxonomic Group" sortBy="#{r.taxonomyName}"
				filterBy="#{r.taxonomyName}"
				style="width:120px;text-align:center;;font-size:0.75em;white-space:normal"
				filterStyle="display:none">
				<h:outputText value="#{r.taxonomyName}" />
			</p:column>
			<p:column headerText="Scientific Name" sortBy="#{r.scientificName}"
				filterBy="#{r.scientificName}"
				style="width:300px;text-align:center;;font-size:0.75em"
				filterStyle="display:none"
				exportFunction="#{reportView.exportLink}">
				<p:link
					href="http://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&amp;id=#{r.speciesTaxId}&amp;lvl=3&amp;lin=f&amp;keep=1&amp;srchmode=1&amp;unlock"
					value="#{r.scientificName}" target="_blank" rel="noreferrer noopener"/>
			</p:column>
			<p:column headerText="Common Name" sortBy="#{r.commonName}"
				filterBy="#{r.commonName}"
				style="width:200px;text-align:center;;font-size:0.75em"
				filterStyle="display:none">
				<h:outputText value="#{r.commonName}" />
			</p:column>
			<p:column headerText="Protein Name" sortBy="#{r.proteinName}"
				filterBy="#{r.proteinName}"
				style="width:400px;text-align:center;;font-size:0.75em"
				filterStyle="display:none"
				exportFunction="#{reportView.exportLink}">
				<p:link href="http://www.ncbi.nlm.nih.gov/protein/#{r.accession}"
					value="#{r.proteinName}" target="_blank" rel="noreferrer noopener"
					styleClass="#{reportView.highlightPartials==true ? (r.partialProtein==true ? 'partialProtein' : null) : null}" />
			</p:column>
			<p:column headerText="Domain Name"
				sortBy="#{reportView.selectedCompletedDomainName}"
				filterBy="#{reportView.selectedCompletedDomainName}"
				style="width:100px;text-align:center;;font-size:0.75em"
				filterStyle="display:none">
				<h:outputText value="#{reportView.selectedCompletedDomainName}" />
			</p:column>
			<p:column headerText="BLASTp Bitscore" sortBy="#{r.blastPBitScore}"
				style="width:80px;text-align:center;;font-size:0.75em;white-space:normal">

				<h:outputText value="#{r.blastPBitScore}">
					<f:convertNumber pattern="#0.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ortholog Candidate" sortBy="#{r.ortholog}"
				filterBy="#{r.ortholog}" filterStyle="display:none"
				style="width:100px;text-align:center;;font-size:0.75em;white-space:normal">
				<h:outputText value="#{r.ortholog}" />
			</p:column>
			<p:column headerText="Ortholog Count"
				style="width:80px;text-align:center;font-size:0.75em;white-space:normal">
				<h:outputText value="#{reportView.level2_ortholog_count}" />
			</p:column>
			<p:column headerText="Cut-off" sortBy="#{r.cutoff}"
				style="width:80px;text-align:center;;font-size:0.75em">
				<h:outputText value="#{r.cutoff}">
					<f:convertNumber pattern="#0.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Percent Similarity"
				sortBy="#{r.percentSimilarity}"
				style="width:100px;text-align:center;;font-size:0.75em;white-space:normal">
				<h:outputText
					value="#{r.percentSimilarity > 1.0 ? 100.0 : r.percentSimilarity*100}"
					styleClass="#{reportView.highlightPercSim==true ? (r.percSimOver==true ? 'percSimOver' : null) : null}">
					<f:convertNumber pattern="#0.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Susceptibility Prediction"
				sortBy="#{r.susceptible}" filterBy="#{r.susceptible}"
				filterStyle="display:none"
				style="width:100px;text-align:center;;font-size:0.75em;white-space:normal">
				<h:outputText value="#{r.susceptible}" />
			</p:column>
			<p:column headerText="Analysis Completed" sortBy="#{r.endDate}"
				filterBy="#{reportView.convertUnixTimeToDate(r.endDate)}"
				filterStyle="display:none"
				style="width:190px;text-align:center;;font-size:0.75em">
				<h:outputText value="#{reportView.convertUnixTimeToDate(r.endDate)}" />
			</p:column>
			<p:column headerText="Eukaryote" sortBy="#{r.eukaryote}"
				style="width:80px;text-align:center;font-size:0.75em;white-space:normal">
				<h:outputText value="#{r.eukaryote ? 'Y' : 'N'}" />
			</p:column>
			<p:column headerText="ECOTOX" exportFunction="#{reportView.exportLink}"
				style="width:190px;text-align:center;font-size:0.75em;">
				<h:outputText value = "-" rendered="#{!r.ecotox}"/>
				<p:link
					href="https://cfpub.epa.gov/ecotox/explore.cfm?ncbi=#{r.speciesTaxId}"
					value="Explore in ECOTOX" target="_blank" rel="noreferrer noopener" rendered="#{r.ecotox}"/>
			</p:column>
		</p:dataTable>

	</ui:composition>
</body>
</html>
